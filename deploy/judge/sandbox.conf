# Sandbox for the judge, which replays untrusted key logs: no privileges, no system calls outside
# what a service needs, no outgoing connections. Seccomp and capabilities only, no namespaces, so
# it works in LXC containers too. Install as a drop-in (deploy/README.md).
[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictNamespaces=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallErrorNumber=EPERM
# Serve on localhost; never connect out. IPAddress* needs BPF and is skipped with a warning
# where the kernel or container does not allow it.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
IPAddressDeny=any
IPAddressAllow=localhost
UMask=0077
# Not set on purpose: MemoryDenyWriteExecute=yes breaks V8's JIT compiler.
