# Sandbox for both vimchallenge services (the judge replays untrusted key logs): no privileges,
# no system calls outside what a service needs. Seccomp and capabilities only, no namespaces, so
# it works in LXC containers too. Install as a drop-in for each service (deploy/README.md). The
# judge's unit itself keeps it to localhost; the web app also talks to GitHub, Google and Resend.
[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictNamespaces=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallErrorNumber=EPERM
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
UMask=0077
# Not set on purpose: MemoryDenyWriteExecute=yes breaks V8's JIT compiler.
