# File system sandbox for both vimchallenge services: everything read-only, private /tmp and
# /dev, no kernel tunables. Needs mount namespaces; if a service then fails with status
# 226/NAMESPACE (some LXC containers), remove this file and keep sandbox.conf (deploy/README.md).
[Service]
ProtectSystem=strict
ProtectHome=read-only
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
